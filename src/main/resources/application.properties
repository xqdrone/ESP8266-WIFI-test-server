# ============================================================
#  ESP8266 WiFi / TCP 测试服务端配置
# ============================================================

# ---- 浏览器控制台（Web + WebSocket）----
server.port=8080
server.address=0.0.0.0

# ---- 单片机连接的裸 TCP 端口 ----
app.tcp.port=9000

# 收到首条数据前的等待时间（毫秒），防止空连接占线程
app.tcp.handshake-timeout-millis=20000
app.tcp.receive-buffer=4096

# 心跳超时（毫秒）：多长时间没收到单片机数据就判定离线（界面显示为“离线/超时”）
# 若单片机不做定时心跳，把这里调大即可，例如 60000
app.heartbeat-timeout-millis=15000

# 每个设备保留的历史消息条数 / 界面日志行数上限
app.max-history-per-device=50
app.max-work-log-lines=500

# 是否在服务端控制台打印收到的数据
app.echo-to-console=true

# ---- 心跳（保活报文）静默 ----
# 单片机定时发的心跳如果照原样进日志，每 10 秒刷一行，会把真正的数据淹掉。
# 这里配置一组“静默规则”：
#   * 每一项都是一个正则表达式，对收到的整行做“包含匹配”（不是全匹配）；
#   * 命中的报文仍然算作“存活”——照样刷新在线状态、不会触发心跳超时断开——
#     但不会出现在浏览器数据日志、设备历史和控制台日志里（界面设备卡片上单独显示心跳次数）；
#   * 匹配发生在按 app.receive-charset 解码之后，所以中文心跳要保证接收字符集配置正确；
#   * 注意 .properties 文件里反斜杠要写两个，\\s 才表示正则的 \s。
#
# 恢复“所有数据都显示”：留空即可
#   app.quiet-patterns=
# 匹配多种心跳：逗号分隔
#   app.quiet-patterns=(?i)heart[ _-]?beat,^PING$,^KEEPALIVE
app.quiet-patterns=(?i)heart[ _-]?beat

# 静默报文是否也打印到服务端控制台（默认 false，保持安静）。
# 想确认“心跳到底有没有收到”时，临时改成 true。
app.quiet-echo-to-console=false

# ============================================================
#  中文乱码相关（重点）
# ============================================================
# 向单片机发送数据时使用的字符集。
#   UTF-8 : 默认，一个汉字 3 字节，跨平台通用
#   GBK   : 一个汉字 2 字节。中文 Windows 的串口助手默认按 GBK 解码，
#           STM32 上常见的 LCD/OLED 字库也是 GBK —— 串口看到中文乱码时改成 GBK
#
# 注意：浏览器界面顶栏的「下发编码」可以直接点击切换，切换后会自动写入下面的
#       charset-config-file 并立即生效（已连接的设备无需重连）。界面切换过的值
#       优先级高于这里的默认值，所以本项留作“出厂默认”即可。
app.send-charset=UTF-8

# 界面切换编码后保存到的文件（留空表示不保存）。
# 删除这个文件即可恢复到上一行的 app.send-charset 值。
app.charset-config-file=esp8266-console.properties

# 接收单片机数据时使用的字符集，默认 UTF-8。
# 如果单片机上报的中文在浏览器日志/控制台里是乱码（例如它按 GBK 回传），改成 GBK。
app.receive-charset=UTF-8

# true 时，每次下发都会在控制台打印十六进制字节，方便和串口助手对照确认。
# 排查编码问题时临时打开即可。
app.hex-dump-on-send=false

# ---- 其它 ----
spring.main.banner-mode=console
spring.web.resources.cache.period=0
logging.level.root=INFO
logging.level.com.example.esp8266=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n
